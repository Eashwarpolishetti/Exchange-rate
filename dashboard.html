<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="index.css">
</head>
<body id="dash-body">
    <div class="dash-main">
        <h3 class="dash-heading">CURRENCY CONVERTER </h3>

        <p class="dash-enter">enter the value</p>
        <input class="dash-amount" placeholder="Amount">
        <div class="from-to">
            <div class="p-from">
                <p class="dash-from">From</p>
            
                <div class="flag">
                    <img src="https://flagsapi.com/US/flat/64.png">
                    <select class="from-name" name="from-country">
                    </select>
                </div>
            </div>
            <div class="p-to">
                <p class="dash-to">To</p>
            
                <div class="flag">
                    <img src="https://flagsapi.com/IN/flat/64.png">
                    <select class="to-name" name="to-country">
                    </select>
                </div>
            </div>
        </div>
        <button class="convert-btn">convert</button>
        <div class="conversion">
            <p class="dash-convo">After Conversion</p>
            <p class="dash-value">the value of the conversion is </p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="code.js"></script>
    <script src="app.js"></script>
</body>
</html>
